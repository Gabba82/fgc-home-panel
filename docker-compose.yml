services:
  fgc-home-panel:
    build: .
    image: fgc-home-panel:latest
    container_name: fgc-home-panel
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      FGC_TIMEZONE: ${FGC_TIMEZONE:-Europe/Madrid}
      FGC_CACHE_TTL_SECONDS: ${FGC_CACHE_TTL_SECONDS:-30}
      FGC_HTTP_TIMEOUT_SECONDS: ${FGC_HTTP_TIMEOUT_SECONDS:-8}
      FGC_API_BASE_URL: ${FGC_API_BASE_URL:-https://dadesobertes.fgc.cat/api/explore/v2.1/catalog/datasets}
      FGC_LOG_LEVEL: ${FGC_LOG_LEVEL:-INFO}
      FGC_PANEL_TITLE: ${FGC_PANEL_TITLE:-Pròxims trens}
      FGC_PANEL_SUBTITLE: ${FGC_PANEL_SUBTITLE:-}
      FGC_BUS_STOP_IDS: ${FGC_BUS_STOP_IDS:-}
      FGC_AMB_APP_ID: ${FGC_AMB_APP_ID:-5b1fdf3a}
      FGC_AMB_APP_KEY: ${FGC_AMB_APP_KEY:-}
      FGC_BUS_STOP_ID: ${FGC_BUS_STOP_ID:-}
    ports:
      - "${FGC_EXTERNAL_PORT:-8099}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
